[project]
name = "darkroom"
version = "0.1.0"
description = "A reproducible RAW photo pipeline where every edit is a version-controlled YAML recipe"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Steinn Hauser Magnússon" }]
keywords = ["raw", "photography", "image-processing", "reproducible", "cli"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7", # config and recipe schemas
  "typer>=0.12",   # CLI
]

[project.urls]
Homepage = "https://github.com/steinnhauser/darkroom-as-code"

[project.scripts]
darkroom = "darkroom.cli:app"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[tool.ruff]
line-length = 100
target-version = "py312"
lint.select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
